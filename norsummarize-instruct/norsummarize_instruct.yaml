task: norsummarize_instruct
dataset_path: ltg/norsummarize-instruct
training_split: null
test_split: test
doc_to_text: "{{prompt}} {{context}}"
doc_to_target: response
output_type: generate_until
metric_list:
  - metric: bleu
    higher_is_better: true
  - metric: chrf
    higher_is_better: true
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  max_new_tokens: 256
metadata:
  version: 1.1
  primary_metric: bleu
  random_baseline: 0.0
  category: generation_and_summarization
  language: nob
